[project]
name = "rikutoku-study"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3", "django-axes>=8,<9", "gunicorn>=23,<24",
  "Pillow>=11,<13", "jsonschema>=4.23,<5", "markdown-it-py>=4,<5",
  "nh3>=0.3,<0.4", "whitenoise>=6.9,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.16.10,<1", "playwright>=1.55,<2"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app", "."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
