{% extends 'base.html' %}
{% block title %}学習の記録 | 一陸特 学習ノート{% endblock %}
{% block content %}
<p class="eyebrow">PROGRESS / 最新の理解度</p>
<h1>学習の記録</h1>
<p data-preview-status role="status"></p>
<div id="filter-preview">{% include 'stats_preview.html' %}</div>
{% if form.has_questions %}
<section class="card">
  <h2>集計する範囲</h2>
  <form method="get" id="stats-settings" data-preview-url="{% url 'stats-preview' %}">
    {% include 'filters.html' %}<button type="submit" data-apply>条件を適用</button>
  </form>
</section>
{% endif %}
{% endblock %}
