{% load static %}<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}一陸特 学習ノート{% endblock %}</title>
<link rel="stylesheet" href="{% static 'app.css' %}"><link rel="stylesheet" href="{% static 'vendor/katex/katex.min.css' %}">
<script defer src="{% static 'vendor/katex/katex.min.js' %}"></script><script defer src="{% static 'vendor/katex/contrib/auto-render.min.js' %}"></script><script defer src="{% static 'app.js' %}"></script></head>
<body><a class="skip" href="#main">本文へ</a><header><a class="brand" href="/">一陸特 <span>学習ノート</span></a>{% if user.is_authenticated %}<nav aria-label="メイン"><a href="/">学習・復習</a><a href="/stats/">学習の記録</a><a href="/history/">履歴</a><a href="/password/">パスワード</a><form action="/logout/" method="post">{% csrf_token %}<button class="quiet">ログアウト</button></form></nav>{% endif %}</header>
<main id="main">{% block content %}{% endblock %}</main><footer>一問ずつ、理解を積み重ねる。<br>{% if source_url %}<a href="{{ source_url }}">対応ソースコード（AGPL）</a>{% else %}AGPL-3.0-only{% endif %}</footer>
<dialog id="image-dialog" aria-label="図の拡大"><button type="button" id="close-image">閉じる</button><label>拡大率 <input id="zoom" type="range" min="100" max="300" step="25" value="100"></label><div class="zoom-area"><img id="large-image" alt=""></div></dialog></body></html>
